<style>
:root { color-scheme: dark; --bg: #0B1221; --side: #080E1B; --surface: #0F172A; --line: #1C2741; --line2: #24314F; --muted: #94A3B8; --faint: #64748B; --soft: #CBD5E1; --cyan: #38BDF8; --f: "Inter", system-ui, sans-serif; --fh: "Space Grotesk", "Inter", sans-serif }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: #fff; font: 16px/1.6 var(--f); -webkit-font-smoothing: antialiased }
a { color: inherit; text-decoration: none }
button { font: inherit; color: inherit; cursor: pointer }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px }
header { position: sticky; top: 0; z-index: 5; background: rgb(8 14 27 / .85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line) }
header .wrap { height: 68px; display: flex; align-items: center; gap: 18px }
header img { height: 28px; width: auto } header .sp { flex: 1 }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 9px; overflow: hidden }
.seg button { border: 0; background: none; padding: 7px 11px; font: 700 11px ui-monospace, monospace; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--cyan); color: var(--bg) }
.btn { display: inline-flex; align-items: center; border-radius: 999px; background: var(--cyan); color: var(--bg); padding: 12px 20px; font: 700 14px/1 var(--f); white-space: nowrap }
h1 { font: 700 clamp(38px, 5.4vw, 64px)/1.02 var(--fh); letter-spacing: -.035em; margin: 90px 0 16px; text-wrap: balance }
.lead { color: var(--muted); font-size: 19px; max-width: 52ch; margin: 0 0 40px }
.cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px }
.cats button { border: 1px solid var(--line2); background: transparent; color: var(--muted); border-radius: 999px; padding: 9px 16px; font-weight: 600; font-size: 14px }
.cats button[aria-pressed="true"] { background: var(--cyan); border-color: var(--cyan); color: var(--bg) }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding-bottom: 100px }
.svc { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; display: grid; gap: 10px; align-content: start }
.svc .c { font: 600 11px var(--f); letter-spacing: .16em; text-transform: uppercase; color: var(--cyan) }
.svc h2 { margin: 0; font: 700 19px/1.25 var(--fh); letter-spacing: -.02em }
.svc p { margin: 0; color: var(--muted); font-size: 15px }
.svc ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 5px }
.svc li { font-size: 14px; color: var(--soft); padding-left: 16px; position: relative }
.svc li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan) }
.svc.hide { display: none }
.end { text-align: center; padding: 70px 0 100px; border-top: 1px solid var(--line) }
.end h2 { font: 700 clamp(28px, 3.6vw, 42px)/1.1 var(--fh); letter-spacing: -.03em; margin: 0 0 22px }
footer { border-top: 1px solid var(--line); padding: 30px 0; text-align: center; font-size: 13px; color: var(--faint) }
footer a { margin: 0 10px; color: var(--muted) }
@media (max-width: 1020px) { .grid { grid-template-columns: 1fr 1fr } }
@media (max-width: 680px) { .wrap { padding: 0 16px } .grid { grid-template-columns: 1fr } header .btn { display: none } h1 { margin-top: 56px } }
</style>

};

let lang = 'en', cat = 'all';
try { const q = new URLSearchParams(location.search).get('lang'); lang = q || localStorage.getItem('qais-lang') || ((navigator.language || '').startsWith('hu') ? 'hu' : 'en'); } catch (e) {}
if (!TX[lang]) lang = 'en';
function render() {
  const t = TX[lang], L = lang === 'hu' ? 0 : 1;
  document.documentElement.lang = lang;
  document.title = (lang === 'hu' ? 'Szolgáltatások' : 'All services') + ' | Quick AI Setup';
  ['h1', 'lead', 'cta', 'endH', 'cta2'].forEach(k => $(k).textContent = t[k]);
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('cats').innerHTML = `<button data-cat="all" aria-pressed="${cat === 'all'}">${t.all} · ${SVC.length}</button>` + Object.keys(CATS).map(k => `<button data-cat="${k}" aria-pressed="${cat === k}">${esc(CATS[k][lang])}</button>`).join('');
  $('grid').innerHTML = SVC.map(s => { const d = s[1 + L]; return `<article class="svc${cat !== 'all' && cat !== s[0] ? ' hide' : ''}" data-c="${s[0]}"><span class="c">${esc(CATS[s[0]][lang])}</span><h2>${esc(d[0])}</h2><p>${esc(d[1])}</p><ul>${d[2].map(b => `<li>${esc(b)}</li>`).join('')}</ul></article>`; }).join('');
}
document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('qais-lang', lang); } catch (x) {} render(); return; }
  const cb = e.target.closest('[data-cat]');
  if (cb) { cat = cb.dataset.cat; render(); }
});

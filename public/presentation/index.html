<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sample presentation | Quick AI Setup</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root { color-scheme: dark; --bg: #0B1221; --side: #080E1B; --surface: #0F172A; --raised: #131D33; --line: #1C2741; --line2: #24314F; --muted: #94A3B8; --faint: #64748B; --soft: #CBD5E1; --cyan: #38BDF8; --deep: #0284C7; --good: #34D399; --red: #F87171; --f: "Inter", system-ui, sans-serif; --fh: "Space Grotesk", "Inter", sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, monospace }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: #fff; font: 17px/1.55 var(--f); -webkit-font-smoothing: antialiased; overflow: hidden }
button { font: inherit; color: inherit; cursor: pointer }
a { color: inherit; text-decoration: none }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; background: radial-gradient(1000px 600px at 85% -10%, rgb(56 189 248 / .12), transparent 65%), var(--bg) }
.top { display: flex; align-items: center; gap: 14px; padding: 14px max(20px, env(safe-area-inset-left)) 14px max(20px, env(safe-area-inset-right)); border-bottom: 1px solid var(--line) }
.top img { height: 24px } .top .sp { flex: 1 }
.tag { font: 600 11px var(--f); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line2); border-radius: 999px; padding: 6px 12px }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 9px; overflow: hidden }
.seg button { border: 0; background: none; padding: 6px 10px; font: 700 11px var(--mono); color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--cyan); color: var(--bg) }
.x { font-size: 14px; color: var(--muted); white-space: nowrap } .x:hover { color: #fff } .xs-t { display: none }
.stage { overflow-y: auto; display: grid; padding: 28px max(20px, env(safe-area-inset-left)) }
.slide { width: 100%; max-width: 1120px; margin: auto; display: grid; gap: 22px; padding: 20px 0 }
.bot { display: flex; align-items: center; gap: 14px; padding: 12px max(20px, env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line) }
.prog { flex: 1; height: 3px; border-radius: 3px; background: var(--line2); overflow: hidden } .prog i { display: block; height: 100%; background: var(--cyan); transition: width .5s }
.nb { border: 1px solid var(--line2); background: transparent; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 14px }
.nb.go { background: var(--cyan); color: var(--bg); border-color: var(--cyan) }
.nb[disabled] { opacity: .35; cursor: default }
.cnt { font: 600 12px var(--mono); color: var(--faint) }

/* type */
.ey { font: 600 12px var(--f); letter-spacing: .2em; text-transform: uppercase; color: var(--cyan) }
h1 { font: 700 clamp(34px, 5vw, 64px)/1.03 var(--fh); letter-spacing: -.035em; margin: 0; max-width: 20ch; text-wrap: balance }
h1.xl { font-size: clamp(44px, 7.4vw, 104px); max-width: 16ch }
.p { margin: 0; color: var(--muted); font-size: clamp(17px, 1.6vw, 20px); max-width: 60ch }
.src { color: var(--faint); font-size: 12.5px } .ill { font: 600 10.5px var(--f); letter-spacing: .16em; text-transform: uppercase; color: var(--faint) }
.in { opacity: 0; transform: translateY(18px); animation: up .7s cubic-bezier(.2, .7, .2, 1) forwards; animation-delay: var(--d, 0s) }
@keyframes up { to { opacity: 1; transform: none } }
.btn { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; background: var(--cyan); color: var(--bg); padding: 17px 28px; font: 700 16px/1 var(--f) }
.btn.gh { background: transparent; color: #fff; border: 1px solid var(--line2) }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px }
.stats > div { border: 1px solid var(--line); border-radius: 22px; padding: 24px; background: var(--surface); display: grid; gap: 8px; align-content: start }
.stats b { font: 700 clamp(34px, 4vw, 52px)/1 var(--fh); letter-spacing: -.04em; color: var(--cyan) }
.stats span { color: var(--soft) } .stats small { color: var(--faint); font-size: 12.5px }
.clk { border: 1px solid var(--line); border-radius: 22px; padding: 22px; background: var(--surface); display: grid; gap: 12px; max-width: 620px }
.cr { display: grid; grid-template-columns: 170px 1fr 48px; gap: 12px; align-items: center; font-size: 14.5px; color: var(--soft) }
.cr div { height: 12px; border-radius: 6px; background: var(--line2); overflow: hidden } .cr i { display: block; height: 100%; width: 0; background: var(--faint); border-radius: 6px; animation: grow 1.2s cubic-bezier(.2, .7, .2, 1) forwards; animation-delay: var(--gd) }
.cr.ai i { background: var(--red) } .cr b { font-family: var(--mono) }
@keyframes grow { to { width: var(--w) } }
.punch { font: 600 clamp(20px, 2.2vw, 28px)/1.3 var(--fh); letter-spacing: -.02em; max-width: 34ch; margin: 0 }

/* vs + team */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: stretch; max-width: 880px }
.vs > div { border: 1px solid var(--line); border-radius: 22px; padding: 26px; background: var(--surface) }
.vs > div.hi { border-color: var(--cyan); background: linear-gradient(180deg, rgb(56 189 248 / .12), var(--surface)) }
.vs b { font: 700 24px var(--fh) } .vs ul { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; color: var(--soft) }
.vs li::before { content: "– "; color: var(--faint) } .vs .hi li::before { content: "✓ "; color: var(--good) }
.vs .ar { align-self: center; font-size: 28px; color: var(--faint) }
.team { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px }
.role { border: 1px solid var(--line); border-radius: 22px; padding: 22px; background: var(--surface); display: grid; gap: 10px; align-content: start; position: relative }
.role .av { width: 46px; height: 46px; border-radius: 14px; background: rgb(56 189 248 / .14); display: grid; place-items: center; font-size: 22px }
.role b { font: 700 20px var(--fh) } .role p { margin: 0; color: var(--muted); font-size: 15px }
.role:not(:last-child)::after { content: "→"; position: absolute; right: -13px; top: 34px; color: var(--cyan); font-size: 18px; z-index: 2 }

/* question */
.q { min-height: 52vh; display: grid; align-content: center; gap: 22px }
.q h1 { font-size: clamp(38px, 6vw, 84px); max-width: 18ch }
.yn { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px }
.yn button { min-width: 140px; border-radius: 999px; padding: 18px 30px; font: 700 18px var(--f); border: 1px solid var(--line2); background: transparent }
.yn .y { background: var(--cyan); border-color: var(--cyan); color: var(--bg) }
.yn button[aria-pressed="true"] { outline: 3px solid rgb(56 189 248 / .45); outline-offset: 3px }

/* solution */
.sol { display: grid; grid-template-columns: 1fr 1.05fr; gap: 40px; align-items: center }
.sol h1 { font-size: clamp(32px, 4.2vw, 56px) }
.steps { display: grid; gap: 10px; margin-top: 6px }
.steps div { display: grid; grid-template-columns: 30px 1fr; gap: 12px; color: var(--soft) }
.steps i { font-style: normal; font: 600 13px var(--mono); color: var(--cyan); padding-top: 2px }
.demo { border: 1px solid var(--line); border-radius: 26px; background: linear-gradient(180deg, var(--raised), var(--side)); padding: 22px; display: grid; gap: 12px; min-height: 380px; align-content: start; position: relative }
.demo .hd { display: flex; justify-content: space-between; align-items: center; font: 600 14px var(--f) }
.live { display: inline-flex; gap: 6px; align-items: center; font: 600 11px var(--f); letter-spacing: .14em; text-transform: uppercase; color: var(--good) }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); animation: bl 1.6s infinite }
@keyframes bl { 50% { opacity: .3 } }
.pop { opacity: 0; transform: translateY(10px) scale(.98); transition: opacity .45s, transform .45s }
.pop.on { opacity: 1; transform: none }
.b { max-width: 86%; padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.4 }
.b.l { justify-self: start; background: #1E293B; border-bottom-left-radius: 5px } .b.r { justify-self: end; background: var(--deep); border-bottom-right-radius: 5px }
.b small { display: block; font-size: 11px; opacity: .65; margin-bottom: 2px }
.ok { justify-self: center; color: var(--good); background: rgb(52 211 153 / .1); border: 1px solid rgb(52 211 153 / .35); border-radius: 999px; padding: 8px 15px; font: 700 13.5px var(--f) }
.chs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px }
.ch { border: 1px solid var(--line2); border-radius: 14px; padding: 10px 6px; display: grid; justify-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); transition: border-color .3s }
.ch svg { width: 20px; height: 20px; fill: var(--soft) } .ch b { font: 700 18px var(--fh); color: #fff } .ch.hot { border-color: var(--cyan) }
.call { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center }
.call .av { width: 52px; height: 52px; border-radius: 50%; background: var(--deep); display: grid; place-items: center; font-size: 22px; position: relative }
.call .av::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--cyan); animation: rip 2s infinite }
@keyframes rip { to { transform: scale(1.7); opacity: 0 } }
.call .t { font: 600 14px var(--mono); color: var(--good) } .call small { display: block; color: var(--faint); font-size: 12.5px }
.wave { display: flex; align-items: center; gap: 3px; height: 40px } .wave s { flex: 1; border-radius: 3px; background: var(--cyan); animation: wv 1.1s ease-in-out infinite }
.wave s:nth-child(3n) { animation-delay: -.3s } .wave s:nth-child(3n+1) { animation-delay: -.7s }
@keyframes wv { 0%, 100% { height: 18% } 50% { height: 100% } }
.tr { font-size: 14.5px; color: var(--soft) } .tr em { font-style: normal; display: block; font: 600 10.5px var(--f); letter-spacing: .14em; text-transform: uppercase; color: var(--faint) }
.sms { border: 1px dashed var(--line2); border-radius: 14px; padding: 12px 14px; font-size: 14px; color: var(--soft) } .sms b { color: var(--cyan) }
.bk { border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px } .bk b { font: 700 18px var(--fh) } .bk span { color: var(--muted); font-size: 14px }
.tl { display: grid; gap: 8px } .tl div { display: grid; grid-template-columns: 54px 1fr; gap: 10px; font-size: 14px; color: var(--soft) } .tl i { font-style: normal; font: 600 12px var(--mono); color: var(--faint); padding-top: 2px }
.rv { background: #fff; color: #1F2937; border-radius: 16px; padding: 14px; display: grid; gap: 6px; font-size: 14px }
.rv .g { display: flex; gap: 8px; align-items: center; font-weight: 600 } .rv .g svg { width: 16px; height: 16px; fill: #4285F4 }
.rv .st { color: #F59E0B; letter-spacing: 3px; font-size: 17px } .rv .rp { border-top: 1px solid #E5E7EB; padding-top: 8px; color: #4B5563 } .rv .rp b { color: var(--deep) }
.ctr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.ctr div { border: 1px solid var(--line2); border-radius: 16px; padding: 14px; display: grid; gap: 4px } .ctr b { font: 700 28px var(--fh); letter-spacing: -.03em } .ctr span { color: var(--muted); font-size: 13px }
.ctr .g b { color: var(--good) }
.ask { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line2); border-radius: 999px; padding: 12px 18px; font-size: 15px; min-height: 48px } .ask::before { content: "✦"; color: var(--cyan) }
.ask .cur { display: inline-block; width: 2px; height: 1.1em; background: var(--cyan); vertical-align: middle; animation: bl 1s infinite }
.ans { font-size: 15px; color: var(--soft); line-height: 1.6; min-height: 90px } .ans mark { background: rgb(52 211 153 / .16); color: var(--good); border-radius: 6px; padding: 1px 7px; font-weight: 700 }
.eng { display: flex; gap: 6px; flex-wrap: wrap } .eng span { font: 600 11.5px var(--mono); color: var(--muted); border: 1px solid var(--line2); border-radius: 999px; padding: 4px 10px; transition: all .4s } .eng span.on { color: var(--good); border-color: rgb(52 211 153 / .45) } .eng span.on::before { content: "✓ " }

/* a2a + summary + end */
.a2a { border: 1px solid var(--line); border-radius: 26px; padding: 22px; background: var(--surface); display: grid; gap: 10px; max-width: 820px; width: 100% }
.a2a .who { display: flex; justify-content: space-between; font: 600 13px var(--f); color: var(--muted) }
.sumg { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px }
.sumg > div { border: 1px solid var(--line); border-radius: 20px; padding: 20px; background: var(--surface); display: grid; gap: 6px }
.sumg b { font: 700 19px var(--fh) } .sumg span { color: var(--muted); font-size: 14.5px } .sumg i { font-style: normal; font: 600 12px var(--mono); color: var(--cyan) }
.end { text-align: center; justify-items: center }
.end h1 { margin-inline: auto } .end .p { margin-inline: auto }
.ctas { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center }
.hint { color: var(--faint); font-size: 13px }
.gate { display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center }
.gform { border: 1px solid var(--line); border-radius: 26px; background: var(--surface); padding: 28px; display: grid; gap: 13px }
.gform label { display: grid; gap: 6px; font-size: 14px; color: var(--soft) }
.gform input, .gform select { width: 100%; background: var(--side); border: 1px solid var(--line2); border-radius: 12px; padding: 13px 14px; font: 16px var(--f); color: #fff; outline: none }
.gform input:focus, .gform select:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgb(56 189 248 / .14) }
.gform .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.gform .ck { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; font-size: 13px; color: var(--muted); line-height: 1.45 }
.gform .ck input { width: 18px; height: 18px; margin: 1px 0 0; padding: 0; accent-color: var(--cyan) }
.gform .ck a { color: var(--cyan); text-decoration: underline }
.gform .btn { justify-content: center; width: 100%; padding: 18px; margin-top: 4px } .gform .btn[disabled] { opacity: .6; cursor: wait }
.gform .err { color: #FB923C; font-size: 14px } .gform .err:empty { display: none }
.gform .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden }
.gform small { color: var(--faint); font-size: 12.5px; text-align: center }
.sent { border: 1px solid rgb(52 211 153 / .4); background: rgb(52 211 153 / .08); color: var(--good); border-radius: 16px; padding: 16px 18px; font-weight: 600 }

@media (max-width: 860px) {
  .stats, .team { grid-template-columns: 1fr } .role:not(:last-child)::after { display: none }
  .vs { grid-template-columns: 1fr } .vs .ar { display: none }
  .sol { grid-template-columns: 1fr; gap: 24px }
  .demo { min-height: 0 }
  .chs { grid-template-columns: repeat(5, minmax(0, 1fr)) } .ch { font-size: 10px } .ch b { font-size: 15px }
  .cr { grid-template-columns: 120px 1fr 40px }
  .top .tag { display: none } .xl-t { display: none } .xs-t { display: inline; font-size: 24px; line-height: 1; padding: 0 4px }
  .q { min-height: 44vh }
  .gate { grid-template-columns: 1fr; gap: 26px } .gform { padding: 20px } .gform .two { grid-template-columns: 1fr }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; transition: none !important } .in { opacity: 1; transform: none } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a href="/" aria-label="Quick AI Setup"><img src="/brand/logo-for-dark-bg.svg" alt="quickaisetup" width="152" height="24"></a>
    <span class="tag" id="tag"></span>
    <span class="sp"></span>
    <div class="seg" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="hu">HU</button></div>
    <a class="x" href="/" id="exit"></a>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
  <footer class="bot">
    <button class="nb" id="prev" aria-label="Previous">←</button>
    <div class="prog"><i id="bar"></i></div>
    <span class="cnt" id="cnt"></span>
    <button class="nb go" id="next"></button>
  </footer>
</div>

function go(d) { const n = seq().length; const ni = Math.max(0, Math.min(n - 1, i + d)); if (ni === i) return; const cur = seq()[i]; if (d > 0 && cur.k === 'q' && ans[cur.t] === undefined) return; i = ni; render(); }

document.addEventListener('click', e => {

  if (e.target.closest('[data-own]')) { sentOwn = true; track(true, true); render(); return; }
  if (e.target.closest('[data-go]')) { go(1); return; }

document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, select, textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && e.target === document.body)) { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  const cur = seq()[i]; if (cur.k === 'q' && (e.key === 'y' || e.key === 'i' || e.key === 'n')) { ans[cur.t] = e.key !== 'n'; i++; render(); }
});
let sentOwn = false;
let doneSent = false;
function track(completed, own) {
  if (!lead || !lead.cid) return;
  if (completed && !own) { if (doneSent) return; doneSent = true; }
  const S = seq();
  const body = JSON.stringify({ action: 'progress', cid: lead.cid, sig: lead.sig, answers: ans, slide: i + 1, total: S.length, completed: !!completed, own: !!own });
  try { fetch('/api/lead', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true }); } catch (e) {}
}
document.addEventListener('submit', async e => {

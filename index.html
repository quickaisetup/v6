<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quick AI Setup | AI that answers, books and gets you reviews</title>
<meta name="description" content="AI chatbot, AI phone receptionist, automatic Google reviews, GEO and your own branded app, for gyms, massage salons, cafés and hotels in Hungary and Thailand.">
<meta property="og:title" content="Quick AI Setup">
<meta property="og:description" content="AI that answers, books and collects reviews for you, 24/7.">
<meta property="og:image" content="https://www.quickaisetup.com/og.png">
<meta property="og:url" content="https://www.quickaisetup.com">
<meta name="theme-color" content="#0B1221">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..800;1,400..600&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0B1221; --side: #080E1B; --surface: #0F172A; --raised: #131D33; --line: #1C2741;
  --ink: #FFFFFF; --muted: #94A3B8; --faint: #64748B; --soft: #CBD5E1;
  --accent: #2563EB; --accent-hi: #60A5FA; --accent-soft: rgb(37 99 235 / .14);
  --good: #34D399; --gold: #FBBF24; --red: #F87171;
  --f: "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box }
html { scroll-padding-top: 76px }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--f); -webkit-font-smoothing: antialiased; overflow-x: hidden }
a { color: inherit; text-decoration: none }
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 3px }
img { max-width: 100%; display: block }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px }
.eyebrow { font: 600 11px/1.3 var(--f); letter-spacing: .22em; text-transform: uppercase; color: var(--muted) }
.pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgb(37 99 235 / .35); background: rgb(37 99 235 / .08); color: var(--accent-hi); border-radius: 999px; padding: 7px 14px }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-hi); box-shadow: 0 0 10px var(--accent-hi); animation: blink 2s infinite }
@keyframes blink { 50% { opacity: .3 } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; padding: 18px 30px; font: 700 12.5px/1 var(--f); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 14px 34px -12px rgb(37 99 235 / .9); transition: filter .2s, transform .2s }
.btn:hover { filter: brightness(1.12); transform: translateY(-2px) }
.btn.ghost { background: transparent; border: 1px solid var(--line); box-shadow: none }
.btn.ghost:hover { border-color: var(--muted) }
.brand { font: 500 22px/1 var(--f); letter-spacing: -.05em; white-space: nowrap }
.brand b { color: var(--accent); font-weight: 800 }
h1, h2, h3 { margin: 0; letter-spacing: -.045em; text-wrap: balance }
h2 { font: 700 clamp(38px, 5.6vw, 72px)/1.02 var(--f) }
h1 span, h2 span { display: block; font-weight: 500; font-style: italic; color: rgb(255 255 255 / .34) }
.sub { color: var(--muted); font-size: 19px; max-width: 46ch; margin: 0 }
section { padding: 150px 0; position: relative }
.head { display: grid; gap: 22px; margin-bottom: 72px; max-width: 820px }
.head.c { margin-inline: auto; text-align: center; justify-items: center }

/* nav */
.nav { position: fixed; inset: 0 0 auto; z-index: 50; transition: background .3s, border-color .3s; border-bottom: 1px solid transparent }
.nav.solid { background: rgb(8 14 27 / .8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-color: var(--line) }
.nav .wrap { display: flex; align-items: center; gap: 28px; height: 72px }
.nav nav { display: flex; gap: 28px; margin-left: 14px }
.nav nav a { font: 600 12px var(--f); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); transition: color .2s }
.nav nav a:hover { color: #fff }
.nav .sp { flex: 1 }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden }
.seg button { border: 0; background: none; padding: 7px 11px; font: 700 11px var(--mono); color: var(--muted) }
.seg button[aria-pressed="true"] { background: #fff; color: var(--side) }
.nav .btn { padding: 13px 22px; font-size: 11px }

/* hero */
.hero { min-height: 100vh; min-height: 100svh; display: grid; align-items: center; padding: 120px 0 80px; overflow: hidden; background: radial-gradient(900px 600px at 78% 40%, rgb(37 99 235 / .2), transparent 65%) }
.hero .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; width: 100% }
.hero h1 { font: 700 clamp(48px, 7vw, 98px)/.98 var(--f); margin: 26px 0 28px }
.hero h1 .rot { display: grid; align-items: start; font-style: italic; font-weight: 500; color: var(--accent-hi); min-height: 2.04em; overflow: hidden; padding-bottom: .06em }
.hero h1 .rot i { grid-area: 1 / 1; display: block; font-style: italic; transition: transform .6s cubic-bezier(.7, 0, .2, 1), opacity .6s }
.hero h1 .rot i.out { transform: translateY(-60%); opacity: 0; transition-duration: .35s }
.hero h1 .rot i.in { transform: translateY(110%); opacity: 0 }
.cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 40px }
.scroll-hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); width: 26px; height: 42px; border: 2px solid var(--line); border-radius: 14px }
.scroll-hint::after { content: ""; position: absolute; left: 50%; top: 8px; width: 4px; height: 8px; margin-left: -2px; border-radius: 2px; background: var(--accent-hi); animation: sh 1.8s infinite }
@keyframes sh { 60% { transform: translateY(12px); opacity: 0 } 100% { opacity: 0 } }

/* hub animation */
.hub { position: relative; aspect-ratio: 1; width: 100%; max-width: 560px; justify-self: center }
.hub svg { position: absolute; inset: 0; width: 100%; height: 100% }
.ring { fill: none; stroke: var(--line); stroke-dasharray: 2 8 }
.spoke { stroke: rgb(37 99 235 / .25); stroke-width: 1.5 }
.core { position: absolute; left: 50%; top: 50%; width: 30%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3B82F6, #1D4ED8 60%, #172554); display: grid; place-items: center; box-shadow: 0 0 0 14px rgb(37 99 235 / .1), 0 0 0 30px rgb(37 99 235 / .05), 0 0 90px rgb(37 99 235 / .6); animation: breathe 3.2s ease-in-out infinite }
.core b { font: 800 clamp(20px, 2.6vw, 30px) var(--f); letter-spacing: -.04em }
@keyframes breathe { 50% { box-shadow: 0 0 0 20px rgb(37 99 235 / .12), 0 0 0 42px rgb(37 99 235 / .04), 0 0 120px rgb(37 99 235 / .75) } }
.node { position: absolute; transform: translate(-50%, -50%); width: 17%; aspect-ratio: 1; border-radius: 30%; background: var(--raised); border: 1px solid var(--line); display: grid; place-items: center; font-size: clamp(20px, 2.6vw, 30px); box-shadow: 0 20px 40px -20px #000; transition: border-color .3s, box-shadow .3s }
.node.ping { border-color: var(--accent-hi); box-shadow: 0 0 0 6px rgb(96 165 250 / .15), 0 20px 40px -20px #000 }
.node small { position: absolute; top: 104%; font: 600 10px var(--f); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); white-space: nowrap }
.toast { position: absolute; transform: translate(-50%, -50%) scale(.8); opacity: 0; background: rgb(15 23 42 / .95); border: 1px solid rgb(52 211 153 / .4); color: var(--good); font: 700 12.5px var(--f); padding: 8px 13px; border-radius: 999px; white-space: nowrap; transition: opacity .4s, transform .4s; pointer-events: none; box-shadow: 0 10px 30px -10px #000 }
.toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1) }

/* marquee */
.refs { padding: 56px 0; border-block: 1px solid var(--line); background: var(--side); overflow: hidden }
.refs .eyebrow { text-align: center; display: block; margin-bottom: 30px }
.marq { display: flex; width: max-content; gap: 64px; animation: marq 40s linear infinite }
.refs:hover .marq { animation-play-state: paused }
@keyframes marq { to { transform: translateX(-50%) } }
.logo { display: flex; align-items: center; gap: 12px; white-space: nowrap; opacity: .7; transition: opacity .3s }
.logo:hover { opacity: 1 }
.logo b { font: 800 24px var(--f); letter-spacing: -.04em }
.logo em { font-style: normal; font-size: 18px }
.logo span { font: 600 10px var(--f); letter-spacing: .16em; text-transform: uppercase; color: var(--faint) }

/* product showcase */
.show { display: grid; grid-template-columns: 360px 1fr; gap: 48px; align-items: center }
.tabs { display: grid; gap: 10px }
.tab { position: relative; text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 20px; padding: 20px 22px; display: grid; grid-template-columns: 44px 1fr; gap: 4px 16px; align-items: center; overflow: hidden; transition: border-color .3s, background .3s }
.tab i { grid-row: span 2; font-style: normal; width: 44px; height: 44px; border-radius: 14px; background: var(--raised); display: grid; place-items: center; font-size: 21px; transition: background .3s }
.tab b { font: 700 18px var(--f); letter-spacing: -.02em }
.tab span { font-size: 14px; color: var(--faint); line-height: 1.35 }
.tab[aria-selected="true"] { border-color: rgb(37 99 235 / .55); background: linear-gradient(90deg, rgb(37 99 235 / .14), transparent) }
.tab[aria-selected="true"] i { background: var(--accent) }
.tab[aria-selected="true"] span { color: var(--soft) }
.tab .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--accent-hi) }
.tab[aria-selected="true"] .bar { animation: bar var(--dur, 9s) linear forwards }
@keyframes bar { to { width: 100% } }
.stage { position: relative; min-height: 520px; border-radius: 32px; border: 1px solid var(--line); background: radial-gradient(500px 300px at 70% 0%, rgb(37 99 235 / .16), transparent 70%), linear-gradient(180deg, var(--raised), var(--side)); padding: 40px; display: grid; align-content: center; overflow: hidden }
.stage .scene { display: grid; gap: 14px; max-width: 460px; width: 100%; margin: 0 auto }
.stage .ttl { font: 700 13px var(--mono); color: var(--accent-hi); margin-bottom: 6px; letter-spacing: .04em }
.pop { opacity: 0; transform: translateY(14px) scale(.98); transition: opacity .45s, transform .45s }
.pop.on { opacity: 1; transform: none }
.bub { max-width: 84%; padding: 12px 16px; border-radius: 18px; font-size: 15.5px; line-height: 1.45 }
.bub.l { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px }
.bub.r { justify-self: end; background: var(--accent); border-bottom-right-radius: 6px }
.bub small { display: block; font-size: 11px; opacity: .6; margin-bottom: 3px; letter-spacing: .04em }
.typing { justify-self: end; display: flex; gap: 5px; padding: 14px 16px; border-radius: 18px; background: rgb(37 99 235 / .3) }
.typing s { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: dot 1s infinite }
.typing s:nth-child(2) { animation-delay: .15s } .typing s:nth-child(3) { animation-delay: .3s }
@keyframes dot { 50% { transform: translateY(-4px); opacity: .4 } }
.badge { justify-self: center; display: inline-flex; gap: 8px; align-items: center; color: var(--good); background: rgb(52 211 153 / .1); border: 1px solid rgb(52 211 153 / .35); border-radius: 999px; padding: 8px 16px; font: 700 13px var(--f) }
.review { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px }
.review .stars { color: var(--gold); letter-spacing: 3px; font-size: 18px }
.review p { margin: 6px 0 0; font-size: 15px; color: var(--soft) }
.review .rep { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted) }
.review .rep b { color: var(--accent-hi); font-weight: 600 }
.callc { display: grid; justify-items: center; gap: 18px; text-align: center }
.callc .av { width: 96px; height: 96px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-size: 40px; position: relative }
.callc .av::before, .callc .av::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent-hi); animation: ripple 2s infinite }
.callc .av::after { animation-delay: 1s }
@keyframes ripple { to { transform: scale(1.9); opacity: 0 } }
.callc b { font-size: 20px } .callc .t { font: 600 14px var(--mono); color: var(--good) }
.wave { display: flex; align-items: center; gap: 4px; height: 52px; width: 100% }
.wave s { flex: 1; background: linear-gradient(var(--accent-hi), var(--accent)); border-radius: 4px; animation: wv 1.1s ease-in-out infinite }
@keyframes wv { 0%, 100% { height: 14% } 50% { height: 100% } }
.tr { font-size: 15px; color: var(--soft); text-align: left; justify-self: stretch }
.tr em { font-style: normal; color: var(--faint); font-size: 12px; display: block; letter-spacing: .1em; text-transform: uppercase }
.engines { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center }
.engines span { font: 600 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; transition: all .4s }
.engines span.ok { color: var(--good); border-color: rgb(52 211 153 / .45) }
.engines span.ok::before { content: "✓ " }
.ask { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 14px 20px; font-size: 16px; min-height: 54px }
.ask::before { content: "✦"; color: var(--accent-hi) }
.ask .cur { display: inline-block; width: 2px; height: 1.1em; background: var(--accent-hi); vertical-align: middle; animation: blink 1s infinite }
.ans { font-size: 16px; line-height: 1.6; color: var(--soft); min-height: 110px }
.ans mark { background: rgb(52 211 153 / .16); color: var(--good); border-radius: 7px; padding: 2px 8px; font-weight: 700; transition: box-shadow .4s }
.ans mark.glow { box-shadow: 0 0 0 4px rgb(52 211 153 / .2), 0 0 30px rgb(52 211 153 / .4) }
.appsc { display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: center }
.olds { display: grid; gap: 10px }
.olds i { font-style: normal; font-size: 15px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); color: var(--soft); transition: all .4s }
.olds i.x { opacity: .35; text-decoration: line-through; color: var(--red); border-color: rgb(248 113 113 / .3) }
.phone { width: 190px; height: 330px; border-radius: 34px; border: 3px solid #334155; background: linear-gradient(160deg, rgb(37 99 235 / .35), var(--side) 70%); padding: 20px 14px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; align-content: start; box-shadow: 0 40px 80px -30px #000; position: relative }
.phone::before { content: ""; position: absolute; top: 8px; left: 50%; width: 50px; height: 6px; margin-left: -25px; border-radius: 4px; background: #334155 }
.phone > b { grid-column: 1 / -1; text-align: center; font: 800 13px var(--f); letter-spacing: .14em; margin: 8px 0 4px }
.phone > div { aspect-ratio: 1.1; border-radius: 16px; background: rgb(255 255 255 / .08); display: grid; place-items: center; align-content: center; gap: 2px; font-size: 24px; opacity: 0; transform: scale(.6); transition: all .4s cubic-bezier(.3, 1.5, .5, 1) }
.phone > div small { font: 600 9.5px var(--f); color: var(--soft) }
.phone > div.on { opacity: 1; transform: none }

/* numbers */
.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px }
.num { text-align: center; padding: 30px 10px }
.num b { display: block; font: 800 clamp(48px, 6vw, 80px)/1 var(--f); letter-spacing: -.05em; background: linear-gradient(180deg, #fff, #93C5FD); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .12em }
.num span { display: block; margin-top: 12px; color: var(--muted); font-size: 15px }

/* stories */
.stories { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px }
.story { border: 1px solid var(--line); border-radius: 26px; padding: 30px; background: linear-gradient(180deg, var(--raised), var(--surface)); display: grid; gap: 18px; align-content: start; transition: transform .35s, border-color .35s }
.story:hover { transform: translateY(-6px); border-color: rgb(37 99 235 / .5) }
.story .who { display: flex; align-items: center; gap: 14px }
.story .mono-av { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font: 800 18px var(--f); letter-spacing: -.03em; background: var(--accent-soft); color: var(--accent-hi); flex-shrink: 0 }
.story h4 { margin: 0; font: 700 19px/1.2 var(--f); letter-spacing: -.02em }
.story .meta { font-size: 13px; color: var(--faint) }
.story .big { font: 800 40px/1 var(--f); letter-spacing: -.04em; color: #fff }
.story .big small { display: block; font: 500 14px/1.4 var(--f); letter-spacing: 0; color: var(--muted); margin-top: 8px }
.story .tags { display: flex; flex-wrap: wrap; gap: 6px }
.story .tags span { font: 600 12px var(--f); color: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px }

/* services cloud */
.cloud { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 980px; margin: 0 auto }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 12px 18px; font: 600 15px var(--f); color: var(--soft); display: inline-flex; gap: 9px; align-items: center; transition: all .3s }
.chip i { font-style: normal }
.chip:hover, .chip[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); color: #fff; transform: translateY(-2px) }
.chip-info { max-width: 620px; margin: 30px auto 0; text-align: center; min-height: 60px; color: var(--muted); font-size: 17px; transition: opacity .3s }
.chip-info b { display: block; color: #fff; font-size: 20px; margin-bottom: 4px }

/* steps */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px; position: relative }
.steps::before { content: ""; position: absolute; left: 8%; right: 8%; top: 36px; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-hi)); transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform 1.6s cubic-bezier(.6, 0, .2, 1) }
.steps.in::before { --p: 1 }
.st { text-align: center; display: grid; justify-items: center; gap: 14px; position: relative }
.st i { font-style: normal; width: 72px; height: 72px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); display: grid; place-items: center; font-size: 28px; box-shadow: 0 0 0 8px var(--bg) }
.st h4 { margin: 8px 0 0; font: 700 22px var(--f); letter-spacing: -.03em }
.st p { margin: 0; color: var(--muted); font-size: 16px; max-width: 26ch }

/* founder */
.founder .wrap { display: grid; grid-template-columns: 340px 1fr; gap: 72px; align-items: center }
.ph { position: relative; aspect-ratio: 1; display: grid; place-items: center }
.ph::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; background: radial-gradient(closest-side, rgb(37 99 235 / .45), transparent); filter: blur(30px); animation: breathe2 4s ease-in-out infinite }
@keyframes breathe2 { 50% { transform: scale(1.08) } }
.ph img { position: relative; width: 100%; height: auto }
.founder h3 { font: 700 clamp(34px, 4vw, 52px)/1.02 var(--f); margin: 18px 0 8px }
.founder .role { color: var(--accent-hi); font: 700 12px var(--f); letter-spacing: .2em; text-transform: uppercase }
.founder p { color: var(--muted); font-size: 19px; margin: 24px 0 0; max-width: 46ch }
.founder p b { color: #fff; font-weight: 600 }
.creds { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px }
.creds span { border: 1px solid var(--line); border-radius: 999px; padding: 8px 15px; font-size: 14px; color: var(--soft) }

/* audit */
.audit { background: radial-gradient(800px 400px at 50% 100%, rgb(37 99 235 / .22), transparent 70%) }
form { max-width: 720px; margin: 0 auto; background: linear-gradient(180deg, var(--raised), var(--surface)); border: 1px solid var(--line); border-radius: 30px; padding: 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; box-shadow: 0 50px 100px -50px #000 }
form label { display: grid; gap: 8px }
form label.full { grid-column: 1 / -1 }
form input, form textarea { width: 100%; background: rgb(255 255 255 / .03); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 16px; outline: none; resize: vertical; transition: border-color .2s, box-shadow .2s }
form input:focus, form textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
form input::placeholder, form textarea::placeholder { color: var(--faint) }
.consent { grid-column: 1 / -1; display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; font-size: 13.5px; color: var(--muted) }
.consent input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent) }
.consent a { color: var(--accent-hi); text-decoration: underline }
form .btn { grid-column: 1 / -1; padding: 20px }
form .btn[disabled] { opacity: .6; cursor: wait }
.ferr { grid-column: 1 / -1; color: #FB923C; font-size: 14px }
.ferr:empty { display: none }
.done { grid-column: 1 / -1; text-align: center; padding: 40px 10px; display: grid; gap: 14px; justify-items: center }
.done i { font-style: normal; width: 72px; height: 72px; border-radius: 50%; background: rgb(52 211 153 / .14); color: var(--good); display: grid; place-items: center; font-size: 34px; animation: popin .6s cubic-bezier(.3, 1.6, .5, 1) }
@keyframes popin { from { transform: scale(0) } }
.done h4 { margin: 0; font: 700 28px var(--f); letter-spacing: -.03em }
.done p { margin: 0; color: var(--muted) }

footer { border-top: 1px solid var(--line); padding: 44px 0 calc(44px + env(safe-area-inset-bottom, 0px)); background: var(--side) }
footer .wrap { display: flex; flex-wrap: wrap; gap: 20px 40px; align-items: center }
footer .links { display: flex; flex-wrap: wrap; gap: 22px; margin-left: auto }
footer a, footer small { font-size: 13px; color: var(--faint) }
footer a:hover { color: #fff }

    ${HUB_N.map((n, i) => `<div class="node" id="hn${i}" style="left:${pos[i][0]}%;top:${pos[i][1]}%">${n[0]}<small>${n[1]}</small></div>`).join('')}
    ${pos.map((p, i) => `<div class="toast" id="ht${i}" style="left:${50 + (p[0] - 50) * .55}%;top:${50 + (p[1] - 50) * .55 - 2}%"></div>`).join('')}`;
  h._pos = pos;
}
function hubPulse(i) {
  const pos = $('hub')._pos, g = $('pulses'), n = $('hn' + i), t = $('ht' + i);
  if (!g || !n) return;
  n.classList.add('ping');
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('r', '1.3'); c.setAttribute('fill', '#60A5FA');
  c.innerHTML = `<animate attributeName="cx" from="${pos[i][0]}" to="50" dur=".9s" fill="freeze"/><animate attributeName="cy" from="${pos[i][1]}" to="50" dur=".9s" fill="freeze"/><animate attributeName="opacity" values="1;1;0" dur=".9s" fill="freeze"/>`;
  g.appendChild(c);
  setTimeout(() => { c.remove(); n.classList.remove('ping'); t.textContent = HUB_OUT[lang][i]; t.classList.add('on'); }, 900);
  setTimeout(() => t.classList.remove('on'), 2900);
}
function hubLoop() {
  stop('hub'); if (RM) return;
  let k = 0; const order = [0, 2, 1, 4, 3, 5];
  const go = () => { hubPulse(order[k % order.length]); k++; at('hub', 1300, go); };
  at('hub', 800, go);
}

/* ---------- product scenes ---------- */
let cur = 0, auto = true;
const DUR = 9000;
function sceneHTML(i) {
  const hu = lang === 'hu';
  if (i === 0) return `<div class="scene"><div class="ttl">INSTAGRAM · 23:41</div>
    <div class="bub l pop" id="s1"><small>${hu ? 'Vendég' : 'Customer'}</small>${hu ? 'Szia! Van holnap kezdő óra? 🥊' : 'Hi! Any beginner class tomorrow? 🥊'}</div>
    <div class="typing pop" id="s2"><s></s><s></s><s></s></div>
    <div class="bub r pop" id="s3"><small>AI · ${hu ? '6 mp' : '6 sec'}</small>${hu ? 'Szia! Holnap 7:00 és 18:00. Lefoglaljam az egyiket?' : 'Hi! Tomorrow at 7:00 and 18:00. Shall I book one for you?'}</div>
    <div class="bub l pop" id="s4">${hu ? 'A 18:00 jó! 🙌' : '18:00 please! 🙌'}</div>
    <div class="badge pop" id="s5">✓ ${hu ? 'Foglalva · 23:42' : 'Booked · 23:42'}</div></div>`;
  if (i === 1) return `<div class="scene"><div class="ttl">GOOGLE · ${hu ? 'ÉRTÉKELÉS' : 'REVIEW'}</div>
    <div class="bub r pop" id="s1"><small>SMS</small>${hu ? 'Köszönjük, hogy nálunk jártál! Értékelnél egy kattintással? ⭐' : 'Thanks for visiting! Mind leaving a quick review? ⭐'}</div>
    <div class="review pop" id="s2"><div class="stars" id="stars">☆☆☆☆☆</div><p>${hu ? '„Fantasztikus masszázs, mindenkinek ajánlom!”' : '“Amazing massage, highly recommend!”'}</p>
      <div class="rep pop" id="s3"><b>${hu ? 'Válasz a tulajdonostól' : 'Reply from the owner'}</b> · ${hu ? 'Köszönjük, várunk vissza! 🙏' : 'Thank you, see you again soon! 🙏'}</div></div>
    <div class="badge pop" id="s4">★ ${hu ? 'Új 5★ értékelés · megválaszolva' : 'New 5★ review · replied'}</div></div>`;
  if (i === 2) return `<div class="scene callc"><div class="av">🤖</div><div><b>${hu ? 'AI recepciós' : 'AI receptionist'}</b><div class="t" id="ctime">00:00</div></div>
    <div class="wave">${'<s></s>'.repeat(32)}</div>
    <div class="tr pop" id="s1"><em>${hu ? 'Hívó' : 'Caller'}</em>${hu ? '„Holnap este lenne hely két főre?”' : '“Do you have room for two tomorrow evening?”'}</div>
    <div class="tr pop" id="s2"><em>AI</em>${hu ? '„Igen! 19:00-kor van szabad hely. Lefoglaltam, SMS-ben küldöm.”' : '“Yes! 7 pm is free. You’re booked, I’ll text you the details.”'}</div>
    <div class="badge pop" id="s3">✓ ${hu ? 'Foglalva · SMS kiment' : 'Booked · text sent'}</div></div>`;
  if (i === 3) return `<div class="scene"><div class="engines" id="eng"><span>ChatGPT</span><span>Gemini</span><span>Google AI</span><span>Perplexity</span></div>
    <div class="ask"><span id="q"></span><span class="cur"></span></div>
    <div class="ans" id="ans"></div></div>`;
  return `<div class="scene appsc"><div class="olds">${(hu ? ['Foglalóprogram', 'WhatsApp-csoportok', 'Táblázatok', 'Papír'] : ['Booking tools', 'WhatsApp groups', 'Spreadsheets', 'Paper']).map((x, k) => `<i id="o${k}">${x}</i>`).join('')}</div>
    <div class="phone"><b>YOUR APP</b>${(hu ? [['📅', 'Foglalás'], ['🎟', 'Bérlet'], ['💳', 'Fizetés'], ['🔔', 'Értesítés'], ['🔁', 'Utánkövetés'], ['🤖', 'AI-ügynök']] : [['📅', 'Bookings'], ['🎟', 'Passes'], ['💳', 'Payments'], ['🔔', 'Alerts'], ['🔁', 'Follow-ups'], ['🤖', 'AI agent']]).map((m, k) => `<div id="m${k}">${m[0]}<small>${m[1]}</small></div>`).join('')}</div></div>`;
}
function on(id) { const e = $(id); if (e) e.classList.add('on'); }
function playScene(i) {
  stop('sc'); cur = i;
  document.querySelectorAll('.tab').forEach((t, k) => { t.setAttribute('aria-selected', k === i); const b = t.querySelector('.bar'); b.style.animation = 'none'; b.offsetWidth; b.style.animation = ''; });
  const st = $('stage'); st.innerHTML = sceneHTML(i);
  if (i === 0) { at('sc', 300, () => on('s1')); at('sc', 1100, () => on('s2')); at('sc', 2300, () => { $('s2').remove(); on('s3'); }); at('sc', 3700, () => on('s4')); at('sc', 4600, () => on('s5')); }
  if (i === 1) { at('sc', 300, () => on('s1')); at('sc', 1400, () => on('s2')); for (let k = 1; k <= 5; k++) at('sc', 1600 + k * 220, () => $('stars').textContent = '★'.repeat(k) + '☆'.repeat(5 - k)); at('sc', 3400, () => on('s3')); at('sc', 4500, () => on('s4')); }
  if (i === 2) { let s = 0; const tk = () => { s++; const e = $('ctime'); if (e) e.textContent = '00:' + String(s).padStart(2, '0'); at('sc', 1000, tk); }; at('sc', 1000, tk); at('sc', 800, () => on('s1')); at('sc', 2800, () => on('s2')); at('sc', 4600, () => on('s3')); }
  if (i === 3) {
    const hu = lang === 'hu', q = hu ? 'Hol van jó thai box edzés kezdőknek?' : 'Where’s a good Muay Thai gym for beginners?';
    const a = hu ? 'A legjobb értékelésű választás: <mark id="mk">A ti termetek</mark> — kezdő órák minden nap, 4,9★ több száz értékelés alapján.' : 'The top-rated pick is <mark id="mk">Your gym</mark> — beginner classes every day, 4.9★ from hundreds of reviews.';
    [...q].forEach((ch, k) => at('sc', 300 + k * 38, () => $('q').textContent = q.slice(0, k + 1)));
    const t0 = 500 + q.length * 38, plain = a.replace(/<[^>]+>/g, '');
    let shown = 0;
    const stream = () => { shown = Math.min(plain.length, shown + 3); let out = '', n = 0, inTag = false; for (const ch of a) { if (ch === '<') inTag = true; if (inTag) { out += ch; if (ch === '>') inTag = false; continue; } if (n < shown) out += ch; n++; } $('ans').innerHTML = out; if (shown < plain.length) at('sc', 30, stream); else at('sc', 300, () => { const m = $('mk'); if (m) m.classList.add('glow'); }); };
    at('sc', t0, stream);
    document.querySelectorAll('#eng span').forEach((e, k) => at('sc', t0 + 2200 + k * 350, () => e.classList.add('ok')));
  }
  if (i === 4) { for (let k = 0; k < 4; k++) at('sc', 500 + k * 400, () => $('o' + k).classList.add('x')); for (let k = 0; k < 6; k++) at('sc', 2300 + k * 280, () => on('m' + k)); }
  if (auto) at('sc', DUR, () => playScene((i + 1) % PRODS[lang].length));
}
function buildTabs() {
  $('tabs').innerHTML = PRODS[lang].map((p, i) => `<button class="tab" role="tab" data-i="${i}" aria-selected="${i === cur}" style="--dur:${DUR}ms"><i>${p[0]}</i><b>${esc(p[1])}</b><span>${esc(p[2])}</span><em class="bar"></em></button>`).join('');
}

/* ---------- numbers count-up ---------- */
function buildNums() {
  $('nums').innerHTML = NUMS[lang].map((n, i) => `<div class="num rv" style="--d:${i * .1}s"><b data-to="${n[0]}" data-suf="${n[1]}">0${n[1]}</b><span>${esc(n[2])}</span></div>`).join('');
}
function countUp(el) {
  const to = +el.dataset.to, suf = el.dataset.suf, loc = lang === 'hu' ? 'hu-HU' : 'en-GB', t0 = performance.now(), D = RM ? 1 : 1600;
  const f = now => { const p = Math.min(1, (now - t0) / D), v = Math.round(to * (1 - Math.pow(1 - p, 3))); el.textContent = v.toLocaleString(loc) + suf; if (p < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}

/* ---------- render ---------- */
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = lang === 'hu' ? 'Quick AI Setup | AI, ami válaszol, foglal és értékelést gyűjt' : 'Quick AI Setup | AI that answers, books and gets you reviews';
  document.querySelectorAll('[data-t]').forEach(el => { const v = t[el.dataset.t]; if (v == null) return; if (el.hasAttribute('data-html')) el.innerHTML = v; else el.textContent = v; });
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = t[el.dataset.ph]);
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  const logos = CLIENTS.map(c => `<div class="logo"><em>${c[1]}</em><b>${esc(c[0])}</b></div>`).join('');
  $('marq').innerHTML = logos + logos;
  $('stories').innerHTML = STORIES[lang].map((s, i) => `<article class="story rv" style="--d:${(i % 3) * .12}s"><div class="who"><div class="mono-av">${s[0]}</div><div><h4>${esc(s[1])}</h4><div class="meta">${esc(s[2])}</div></div></div><div class="big">${esc(s[3])}<small>${esc(s[4])}</small></div><div class="tags">${s[5].map(x => `<span>${esc(x)}</span>`).join('')}</div></article>`).join('');
  $('cloud').innerHTML = SVC[lang].map((s, i) => `<button class="chip" data-s="${i}" aria-expanded="false"><i>${s[0]}</i>${esc(s[1])}</button>`).join('');
  $('chipInfo').innerHTML = esc(t.aTap);
  $('steps').innerHTML = STEPS[lang].map((s, i) => `<div class="st rv" style="--d:${i * .25}s"><i>${s[0]}</i><h4>${esc(s[1])}</h4><p>${esc(s[2])}</p></div>`).join('');
  $('creds').innerHTML = t.creds.map(x => `<span>${esc(x)}</span>`).join('');
  buildNums(); buildTabs(); playScene(cur); rotStart();
  if (document.querySelector('.done')) showDone();
  observe();
}

/* ---------- reveal on scroll ---------- */
let io;
function observe() {
  if (!('IntersectionObserver' in window)) { document.querySelectorAll('.rv').forEach(e => e.classList.add('in')); return; }
  io = io || new IntersectionObserver(es => es.forEach(en => {
    if (!en.isIntersecting) return;
    const el = en.target; el.classList.add('in'); io.unobserve(el);
    const b = el.querySelector && el.querySelector('b[data-to]'); if (b) countUp(b);
  }), { threshold: .15 });
  document.querySelectorAll('.rv:not(.in), #steps').forEach(e => io.observe(e));
}

document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('qais-lang', lang); const u = new URL(location.href); if (u.searchParams.has('lang')) { u.searchParams.set('lang', lang); history.replaceState(null, '', u); } } catch (err) {} render(); return; }
  const tb = e.target.closest('.tab');
  if (tb) { auto = false; playScene(+tb.dataset.i); return; }
  const ch = e.target.closest('.chip');
  if (ch) { const s = SVC[lang][+ch.dataset.s]; document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-expanded', c === ch)); const info = $('chipInfo'); info.style.opacity = 0; setTimeout(() => { info.innerHTML = `<b>${s[0]} ${esc(s[1])}</b>${esc(s[2])}`; info.style.opacity = 1; }, 150); }
});
addEventListener('scroll', () => $('nav').classList.toggle('solid', scrollY > 20), { passive: true });
// pause product autoplay while off screen
if ('IntersectionObserver' in window) new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting && auto) playScene(cur); else if (!en.isIntersecting) stop('sc'); }), { threshold: .3 }).observe($('stage'));

/* ---------- audit form → same Apps Script endpoint and payload keys as before ---------- */
const GAS = 'https://script.google.com/macros/s/AKfycbzFvn6jZhTvPh9hrHAUTh_zI3_s-MeTufmi2P6fG5s8bvjqVyZ4coC0QrFC08_22XDEwA/exec';
const form = $('auditForm');
function showDone() { const t = T[lang]; form.innerHTML = `<div class="done"><i>✓</i><h4>${esc(t.doneH)}</h4><p>${esc(t.doneP)}</p></div>`; }
form.addEventListener('submit', async e => {
  e.preventDefault();
  const t = T[lang], fd = new FormData(form), err = $('ferr'), btn = form.querySelector('button[type=submit]');
  const v = k => String(fd.get(k) || '').trim();
  if (!v('fullName') || !v('workEmail') || !v('businessName') || !v('mainGoal') || !form.consent.checked) { err.textContent = t.fErrReq; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('workEmail'))) { err.textContent = t.fErrMail; return; }
  err.textContent = ''; btn.disabled = true; btn.textContent = t.fSending;
  const payload = { fullName: v('fullName'), workEmail: v('workEmail'), businessName: v('businessName'), website: v('website'), mainGoal: v('mainGoal'), consentGiven: true, consentTimestamp: new Date().toISOString(), sourcePage: location.href, userAgent: navigator.userAgent };
  try { await fetch(GAS, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); showDone(); }
  catch (x) { err.textContent = t.fErr; btn.disabled = false; btn.textContent = t.fSend; }
});

$('yr').textContent = new Date().getFullYear();
hubBuild(); hubLoop(); render();
</script>

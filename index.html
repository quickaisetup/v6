<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quick AI Setup | AI systems for gyms, salons and hospitality</title>
<meta name="description" content="AI chatbot, AI phone receptionist, automatic Google reviews, GEO and your own branded app. We build and run it for gyms, massage salons, cafés and hotels.">
<meta property="og:title" content="Quick AI Setup">
<meta property="og:description" content="AI systems that answer, book and follow up for you, 24/7.">
<meta property="og:image" content="https://quickaisetup.com/og.png">
<meta property="og:url" content="https://quickaisetup.com">
<meta name="theme-color" content="#0B1221">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..800;1,400..600&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0B1221; --side: #080E1B; --surface: #0F172A; --raised: #131D33; --line: #1C2741;
  --ink: #FFFFFF; --muted: #94A3B8; --faint: #64748B; --soft: #CBD5E1;
  --accent: #2563EB; --accent-hi: #60A5FA; --accent-soft: rgb(37 99 235 / .14);
  --good: #34D399; --flag: #FB923C;
  --f: "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --w: 1180px;
}
* { box-sizing: border-box }
html { scroll-behavior: smooth; scroll-padding-top: 80px }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f); -webkit-font-smoothing: antialiased; overflow-x: hidden }
a { color: inherit; text-decoration: none }
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 3px }
img { max-width: 100%; display: block }
.wrap { max-width: var(--w); margin: 0 auto; padding: 0 24px }
.eyebrow { font: 600 11px/1.3 var(--f); letter-spacing: .2em; text-transform: uppercase; color: var(--muted) }
.pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgb(37 99 235 / .35); background: rgb(37 99 235 / .08); color: var(--accent-hi); border-radius: 999px; padding: 7px 14px }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-hi); box-shadow: 0 0 10px var(--accent-hi) }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; padding: 16px 28px; font: 700 12.5px/1 var(--f); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 14px 34px -12px rgb(37 99 235 / .9); transition: filter .2s, transform .2s }
.btn:hover { filter: brightness(1.12); transform: translateY(-1px) }
.btn.ghost { background: transparent; border: 1px solid var(--line); box-shadow: none }
.btn.ghost:hover { border-color: var(--muted) }
.brand { font: 500 22px/1 var(--f); letter-spacing: -.05em; white-space: nowrap }
.brand b { color: var(--accent); font-weight: 800 }
h1, h2, h3 { margin: 0; letter-spacing: -.04em; text-wrap: balance }
h2 { font: 700 clamp(32px, 4.6vw, 54px)/1.05 var(--f) }
h2 span, h1 span { font-weight: 500; font-style: italic; color: rgb(255 255 255 / .36) }
.lead { color: var(--muted); font-size: 17px; max-width: 60ch; margin: 0 }
section { padding: 110px 0; position: relative }
.sec-head { display: grid; gap: 18px; margin-bottom: 56px; max-width: 760px }

/* nav */
.nav { position: sticky; top: 0; z-index: 50; background: rgb(8 14 27 / .78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line) }
.nav .wrap { display: flex; align-items: center; gap: 28px; height: 68px }
.nav nav { display: flex; gap: 26px; margin-left: 12px }
.nav nav a { font: 600 12px var(--f); letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.nav nav a:hover { color: var(--ink) }
.nav .sp { flex: 1 }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden }
.seg button { border: 0; background: none; padding: 7px 11px; font: 700 11px var(--mono); color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--side) }
.nav .btn { padding: 12px 20px; font-size: 11px }

/* hero */
.hero { padding: 90px 0 100px; background: radial-gradient(900px 520px at 85% -10%, rgb(37 99 235 / .2), transparent 65%), radial-gradient(700px 400px at -10% 110%, rgb(37 99 235 / .08), transparent 60%) }
.hero .wrap { display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: center }
.hero h1 { font: 700 clamp(44px, 6.4vw, 84px)/1.0 var(--f); margin: 22px 0 24px }
.hero h1 span { display: block }
.hero .lead { font-size: 18px }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 34px }
.for { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 36px }
.for span { font-size: 13px; color: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; background: rgb(255 255 255 / .02) }

/* hero live panel */
.live { background: linear-gradient(180deg, var(--raised), var(--surface)); border: 1px solid var(--line); border-radius: 26px; padding: 18px; box-shadow: 0 40px 90px -40px rgb(2 6 23 / 1), 0 0 0 1px rgb(37 99 235 / .06) }
.live-top { display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; border-bottom: 1px solid var(--line) }
.live-top .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 10px var(--good); animation: pulse 2s infinite }
@keyframes pulse { 50% { opacity: .35 } }
.live-top b { font-size: 14px }
.live-top .mono { margin-left: auto; font: 600 11px var(--mono); color: var(--faint) }
.feed { display: grid; gap: 10px; padding-top: 14px; min-height: 360px; align-content: start }
.ev { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: 16px; background: rgb(255 255 255 / .025); border: 1px solid var(--line); opacity: 0; transform: translateY(10px); transition: opacity .5s, transform .5s }
.ev.on { opacity: 1; transform: none }
.ev i { font-style: normal; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); font-size: 16px }
.ev small { display: block; font: 600 10.5px var(--f); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: 3px }
.ev p { margin: 0; font-size: 14px; color: var(--soft); line-height: 1.45 }
.ev p b { color: #fff }
.ev .ok { color: var(--good); font-weight: 600 }

/* featured products */
.feat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px }
.fp { position: relative; background: linear-gradient(180deg, var(--raised), var(--surface)); border: 1px solid var(--line); border-radius: 28px; padding: 34px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 16px; overflow: hidden; transition: border-color .3s, transform .3s }
.fp:hover { border-color: rgb(37 99 235 / .5); transform: translateY(-3px) }
.fp::after { content: ""; position: absolute; inset: -40% -30% auto auto; width: 70%; height: 70%; background: radial-gradient(closest-side, rgb(37 99 235 / .16), transparent); pointer-events: none }
.fp .num { font: 700 12px var(--mono); color: var(--accent-hi) }
.fp h3 { font: 700 30px/1.1 var(--f) }
.fp p { margin: 0; color: var(--muted) }
.fp ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px }
.fp li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 15px; color: var(--soft) }
.fp li::before { content: "✓"; color: var(--good); font-weight: 700 }
.vis { border: 1px solid var(--line); background: var(--side); border-radius: 18px; padding: 16px; min-height: 172px; display: grid; gap: 8px; align-content: center }
.bub { max-width: 82%; padding: 9px 13px; border-radius: 15px; font-size: 13.5px; line-height: 1.4 }
.bub.l { justify-self: start; background: var(--raised); border: 1px solid var(--line); border-bottom-left-radius: 5px }
.bub.r { justify-self: end; background: var(--accent); border-bottom-right-radius: 5px }
.bub small { display: block; font-size: 10.5px; opacity: .65; margin-bottom: 2px; letter-spacing: .05em }
.stars { color: #FBBF24; letter-spacing: 2px }
.call { display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center }
.call .av { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-size: 20px; box-shadow: 0 0 0 6px rgb(37 99 235 / .15), 0 0 0 12px rgb(37 99 235 / .07) }
.call b { display: block; font-size: 15px }
.call span { font-size: 12.5px; color: var(--muted) }
.call .t { font: 600 13px var(--mono); color: var(--good) }
.wave { display: flex; align-items: center; gap: 3px; height: 34px; margin: 6px 0 }
.wave s { flex: 1; background: var(--accent-hi); border-radius: 3px; opacity: .8; animation: wv 1.2s ease-in-out infinite }
@keyframes wv { 0%, 100% { height: 20% } 50% { height: 100% } }
.tline { font-size: 13px; color: var(--soft) } .tline em { font-style: normal; color: var(--good) }
.ai-q { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; font-size: 13.5px; color: var(--soft) }
.ai-q::before { content: "✦"; color: var(--accent-hi) }
.ai-a { font-size: 13.5px; color: var(--soft); line-height: 1.5; padding: 4px 4px 0 }
.ai-a mark { background: rgb(52 211 153 / .14); color: var(--good); border-radius: 6px; padding: 1px 6px; font-weight: 700 }
.engines { display: flex; gap: 6px; flex-wrap: wrap }
.engines span { font: 600 10.5px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px }
.appv { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center }
.phone { width: 112px; height: 172px; border-radius: 22px; border: 2px solid #334155; background: linear-gradient(160deg, rgb(37 99 235 / .25), var(--surface)); padding: 12px 9px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; align-content: start }
.phone b { grid-column: 1 / -1; font-size: 11px; text-align: center; letter-spacing: .1em; margin-bottom: 4px }
.phone i { font-style: normal; aspect-ratio: 1; border-radius: 10px; background: rgb(255 255 255 / .07); display: grid; place-items: center; font-size: 17px }
.repl { display: grid; gap: 6px }
.repl s { text-decoration: line-through; color: #F87171; opacity: .6; font-size: 13px }
.repl strong { font-size: 13px; color: var(--good) }
.fp .btn { justify-self: start; padding: 13px 22px; font-size: 11px }

/* catalogue */
.cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px }
.cats button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 9px 16px; font: 600 13px var(--f) }
.cats button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px }
.svc { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: grid; gap: 10px; align-content: start }
.svc h4 { margin: 0; font: 700 17px/1.3 var(--f); letter-spacing: -.02em }
.svc p { margin: 0; font-size: 14.5px; color: var(--muted) }
.svc ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 5px }
.svc li { font-size: 13.5px; color: var(--soft); padding-left: 16px; position: relative }
.svc li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent) }
.svc.hide { display: none }

/* industries */
.inds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px }
.ind { border: 1px solid var(--line); border-radius: 22px; padding: 26px; background: linear-gradient(180deg, rgb(37 99 235 / .07), transparent) }
.ind i { font-style: normal; font-size: 30px }
.ind h4 { margin: 14px 0 8px; font: 700 19px var(--f); letter-spacing: -.02em }
.ind p { margin: 0; font-size: 14.5px; color: var(--muted) }

/* why + work */
.why { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 22px; overflow: hidden }
.why div { background: var(--bg); padding: 26px }
.why b { display: block; font-size: 16px; margin-bottom: 6px }
.why span { font-size: 14px; color: var(--muted) }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; counter-reset: s }
.step { border-top: 2px solid var(--accent); padding-top: 22px; counter-increment: s }
.step::before { content: "0" counter(s); font: 700 13px var(--mono); color: var(--accent-hi) }
.step h4 { margin: 10px 0 8px; font: 700 19px/1.25 var(--f); letter-spacing: -.02em }
.step p { margin: 0; color: var(--muted); font-size: 14.5px }
.models { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 48px }
.model { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px }
.model b { display: block; margin-bottom: 6px }
.model span { font-size: 14px; color: var(--muted) }

/* founder */
.founder { background: var(--side); border-block: 1px solid var(--line) }
.founder .wrap { display: grid; grid-template-columns: 360px 1fr; gap: 60px; align-items: center }
.ph { position: relative; aspect-ratio: 1; display: grid; place-items: center }
.ph::before { content: ""; position: absolute; inset: 4%; border-radius: 50%; background: radial-gradient(closest-side, rgb(37 99 235 / .35), transparent); filter: blur(30px) }
.ph img { position: relative; width: 100%; height: auto; filter: drop-shadow(0 30px 50px rgb(2 6 23 / .9)) }
.founder h3 { font: 700 clamp(30px, 3.6vw, 44px)/1.05 var(--f); margin: 16px 0 6px }
.founder .role { color: var(--accent-hi); font: 700 12px var(--f); letter-spacing: .2em; text-transform: uppercase }
.founder p { color: var(--muted); margin: 18px 0 0; max-width: 62ch }
.founder p b { color: var(--soft); font-weight: 600 }

/* audit form */
.audit .wrap { display: grid; grid-template-columns: .9fr 1.1fr; gap: 56px; align-items: start }
.audit ul { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 12px }
.audit li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; color: var(--soft) }
.audit li::before { content: "✓"; color: var(--good); font-weight: 700 }
form { background: linear-gradient(180deg, var(--raised), var(--surface)); border: 1px solid var(--line); border-radius: 28px; padding: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px }
form label { display: grid; gap: 7px }
form label.full { grid-column: 1 / -1 }
form input, form textarea { width: 100%; background: rgb(255 255 255 / .03); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; font-size: 15px; outline: none; resize: vertical }
form input:focus, form textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
form input::placeholder, form textarea::placeholder { color: var(--faint) }
.consent { grid-column: 1 / -1; display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; font-size: 13px; color: var(--muted) }
.consent input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent) }
.consent a { color: var(--accent-hi); text-decoration: underline }
form .btn { grid-column: 1 / -1; padding: 19px }
form .btn[disabled] { opacity: .6; cursor: wait }
.ferr { grid-column: 1 / -1; color: var(--flag); font-size: 14px; min-height: 0 }
.done { grid-column: 1 / -1; text-align: center; padding: 40px 10px; display: grid; gap: 12px; justify-items: center }
.done i { font-style: normal; width: 60px; height: 60px; border-radius: 50%; background: rgb(52 211 153 / .14); color: var(--good); display: grid; place-items: center; font-size: 28px }
.done h4 { margin: 0; font: 700 26px var(--f); letter-spacing: -.03em }
.done p { margin: 0; color: var(--muted) }

/* cta band + footer */
.band { padding: 90px 0; text-align: center; background: radial-gradient(700px 300px at 50% 120%, rgb(37 99 235 / .25), transparent 70%) }
.band h2 { margin: 0 auto 18px; max-width: 18ch }
.band .lead { margin: 0 auto 32px }
footer { border-top: 1px solid var(--line); padding: 44px 0 calc(44px + env(safe-area-inset-bottom, 0px)); background: var(--side) }
footer .wrap { display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: center }
footer .links { display: flex; flex-wrap: wrap; gap: 22px; margin-left: auto }
footer a, footer small { font-size: 13px; color: var(--faint) }
footer a:hover { color: var(--ink) }

.reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s, transform .7s }
.reveal.in { opacity: 1; transform: none }

@media (max-width: 1020px) {
  .hero .wrap, .audit .wrap, .founder .wrap { grid-template-columns: 1fr }
  .founder .wrap { gap: 32px } .ph { max-width: 320px }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .inds, .why, .steps, .models { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .nav nav { display: none }
}
@media (max-width: 680px) {
  .wrap { padding: 0 16px }
  section { padding: 76px 0 }
  .hero { padding: 56px 0 70px }
  .feat, .grid, .inds, .why, .steps, .models { grid-template-columns: 1fr }
  .fp { padding: 24px }
  .fp h3 { font-size: 26px }
  form { grid-template-columns: 1fr; padding: 22px }
  .nav .wrap { gap: 12px }
  .nav .btn { display: none }
  .brand { font-size: 20px }
  .feed { min-height: 330px }
  footer .links { margin-left: 0 }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important }
  .reveal, .ev { opacity: 1; transform: none }
}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a href="#top" class="brand" aria-label="Quick AI Setup">quick<b>ai</b>setup</a>
    <nav>
      <a href="#products" data-t="navProducts"></a>
      <a href="#all" data-t="navAll"></a>
      <a href="#how" data-t="navHow"></a>
      <a href="#about" data-t="navAbout"></a>
    </nav>
    <span class="sp"></span>
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="hu" aria-pressed="false">HU</button>
    </div>
    <a href="#audit" class="btn" data-t="ctaAudit"></a>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div>
        <span class="eyebrow pill" data-t="heroPill"></span>
        <h1 data-t="heroH" data-html></h1>
        <p class="lead" data-t="heroP"></p>
        <div class="hero-cta">
          <a href="#audit" class="btn" data-t="ctaAudit2"></a>
          <a href="#products" class="btn ghost" data-t="ctaSee"></a>
        </div>
        <div class="for" id="forList"></div>
      </div>
      <div class="live" aria-hidden="true">
        <div class="live-top"><span class="dot"></span><b data-t="liveH"></b><span class="mono" id="liveClock">23:47</span></div>
        <div class="feed" id="feed"></div>
      </div>
    </div>
  </section>

  <section id="products">
    <div class="wrap">
      <div class="sec-head reveal">
        <span class="eyebrow" data-t="prodEy"></span>
        <h2 data-t="prodH" data-html></h2>
        <p class="lead" data-t="prodP"></p>
      </div>
      <div class="feat" id="feat"></div>
    </div>
  </section>

  <section id="all" style="background:var(--side);border-block:1px solid var(--line)">
    <div class="wrap">
      <div class="sec-head reveal">
        <span class="eyebrow" data-t="allEy"></span>
        <h2 data-t="allH" data-html></h2>
        <p class="lead" data-t="allP"></p>
      </div>
      <div class="cats" id="cats"></div>
      <div class="grid" id="svcGrid"></div>
    </div>
  </section>

  <section id="who">
    <div class="wrap">
      <div class="sec-head reveal">
        <span class="eyebrow" data-t="whoEy"></span>
        <h2 data-t="whoH" data-html></h2>
      </div>
      <div class="inds" id="inds"></div>
    </div>
  </section>

  <section id="why" style="padding-top:0">
    <div class="wrap">
      <div class="sec-head reveal">
        <span class="eyebrow" data-t="whyEy"></span>
        <h2 data-t="whyH" data-html></h2>
      </div>
      <div class="why reveal" id="whyGrid"></div>
    </div>
  </section>

  <section id="how" style="background:var(--side);border-top:1px solid var(--line)">
    <div class="wrap">
      <div class="sec-head reveal">
        <span class="eyebrow" data-t="howEy"></span>
        <h2 data-t="howH" data-html></h2>
      </div>
      <div class="steps reveal" id="steps"></div>
      <div class="models reveal" id="models"></div>
    </div>
  </section>

  <section id="about" class="founder">
    <div class="wrap">
      <div class="ph reveal"><img src="/founder.png" alt="Sándor Bárány" loading="lazy" width="720" height="694"></div>
      <div class="reveal">
        <span class="eyebrow pill" data-t="fEy"></span>
        <h3>Sándor Bárány</h3>
        <div class="role" data-t="fRole"></div>
        <p data-t="f1" data-html></p>
        <p data-t="f2" data-html></p>
        <p data-t="f3" data-html></p>
      </div>
    </div>
  </section>

  <section id="audit" class="audit">
    <div class="wrap">
      <div class="reveal">

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let lang = 'en', cat = 'all';
try { const q = new URLSearchParams(location.search).get('lang'); lang = q || localStorage.getItem('qais-lang') || ((navigator.language || '').startsWith('hu') ? 'hu' : 'en'); } catch (e) {}
if (!T[lang]) lang = 'en';

function render() {
  const t = T[lang], L = lang === 'hu' ? 0 : 1;
  document.documentElement.lang = lang;
  document.title = lang === 'hu' ? 'Quick AI Setup | AI rendszerek edzőtermeknek, szalonoknak, vendéglátásnak' : 'Quick AI Setup | AI systems for gyms, salons and hospitality';
  document.querySelectorAll('[data-t]').forEach(el => { const v = t[el.dataset.t]; if (v == null) return; if (el.hasAttribute('data-html')) el.innerHTML = v; else el.textContent = v; });
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = t[el.dataset.ph]);
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('forList').innerHTML = FOR[lang].map(x => `<span>${esc(x)}</span>`).join('');
  $('feat').innerHTML = FEAT[lang].map((p, i) => `<article class="fp reveal in"><span class="num">0${i + 1}</span><h3>${esc(p[0])}</h3><div class="vis" aria-hidden="true">${VIS[p[3]](lang)}</div><div style="display:grid;gap:16px;align-content:start"><p>${esc(p[1])}</p><ul>${p[2].map(b => `<li>${esc(b)}</li>`).join('')}</ul></div><a href="#audit" class="btn ghost">${esc(t.ctaAudit2)} →</a></article>`).join('');
  $('cats').innerHTML = `<button data-cat="all" aria-pressed="${cat === 'all'}">${t.allCat} · ${SVC.length}</button>` + Object.keys(CATS).map(k => `<button data-cat="${k}" aria-pressed="${cat === k}">${esc(CATS[k][lang])}</button>`).join('');
  $('svcGrid').innerHTML = SVC.map(s => { const d = s[1 + L]; return `<div class="svc${cat !== 'all' && cat !== s[0] ? ' hide' : ''}" data-c="${s[0]}"><span class="eyebrow">${esc(CATS[s[0]][lang])}</span><h4>${esc(d[0])}</h4><p>${esc(d[1])}</p><ul>${d[2].map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>`; }).join('');
  $('inds').innerHTML = INDS[lang].map(x => `<div class="ind reveal in"><i>${x[0]}</i><h4>${esc(x[1])}</h4><p>${esc(x[2])}</p></div>`).join('');
  $('whyGrid').innerHTML = WHY[lang].map(x => `<div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('');
  $('steps').innerHTML = STEPS[lang].map(x => `<div class="step"><h4>${esc(x[0])}</h4><p>${esc(x[1])}</p></div>`).join('');
  $('models').innerHTML = MODELS[lang].map(x => `<div class="model"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('');
  $('aList').innerHTML = t.aList.map(x => `<li>${esc(x)}</li>`).join('');
  const done = document.querySelector('.done'); if (done) showDone();
  playFeed();
}

let feedTimers = [];
function playFeed() {
  feedTimers.forEach(clearTimeout); feedTimers = [];
  const f = $('feed'), items = FEED[lang];
  f.innerHTML = items.map(e => `<div class="ev"><i>${e[0]}</i><div><small>${esc(e[1])}</small><p>${e[2]}</p></div></div>`).join('');
  const evs = [...f.children], reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clocks = ['23:41', '23:41', '23:44', '23:45', '23:47'];
  evs.forEach((el, i) => feedTimers.push(setTimeout(() => { el.classList.add('on'); $('liveClock').textContent = clocks[i]; }, reduce ? 0 : 500 + i * 1100)));
  if (!reduce) feedTimers.push(setTimeout(() => { evs.forEach(e => e.classList.remove('on')); feedTimers.push(setTimeout(playFeed, 700)); }, 500 + items.length * 1100 + 5000));
}

document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('qais-lang', lang); const u = new URL(location.href); if (u.searchParams.has('lang')) { u.searchParams.set('lang', lang); history.replaceState(null, '', u); } } catch (err) {} render(); return; }
  const cb = e.target.closest('[data-cat]');
  if (cb) { cat = cb.dataset.cat; document.querySelectorAll('[data-cat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === cat)); document.querySelectorAll('.svc').forEach(s => s.classList.toggle('hide', cat !== 'all' && s.dataset.c !== cat)); }
});

// audit form → same Google Apps Script endpoint and payload keys as the previous site
const GAS = 'https://script.google.com/macros/s/AKfycbzFvn6jZhTvPh9hrHAUTh_zI3_s-MeTufmi2P6fG5s8bvjqVyZ4coC0QrFC08_22XDEwA/exec';
const form = $('auditForm');
function showDone() { const t = T[lang]; form.innerHTML = `<div class="done"><i>✓</i><h4>${esc(t.doneH)}</h4><p>${esc(t.doneP)}</p></div>`; }
form.addEventListener('submit', async e => {
  e.preventDefault();
  const t = T[lang], fd = new FormData(form), err = $('ferr'), btn = form.querySelector('button[type=submit]');
  const v = k => String(fd.get(k) || '').trim();
  if (!v('fullName') || !v('workEmail') || !v('businessName') || !v('mainGoal') || !form.consent.checked) { err.textContent = t.fErrReq; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('workEmail'))) { err.textContent = t.fErrMail; return; }
  err.textContent = ''; btn.disabled = true; btn.textContent = t.fSending;
  const payload = { fullName: v('fullName'), workEmail: v('workEmail'), businessName: v('businessName'), website: v('website'), mainGoal: v('mainGoal'), consentGiven: true, consentTimestamp: new Date().toISOString(), sourcePage: location.href, userAgent: navigator.userAgent };
  try {
    await fetch(GAS, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    showDone();
  } catch (x) { err.textContent = t.fErr; btn.disabled = false; btn.textContent = t.fSend; }
});

const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { threshold: .12 }) : null;
document.querySelectorAll('.reveal').forEach(el => io ? io.observe(el) : el.classList.add('in'));
$('yr').textContent = new Date().getFullYear();
render();
</script>
